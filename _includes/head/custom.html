{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="var(--global-bg-color)"/>
<style>
    /* --- Home page: photo ~35% / text ~62%, like the reference site --- */
  @media (min-width: 48em) {
    #main:has(.sidebar) { max-width: 1100px !important; }
    #main .sidebar,
    #main .sidebar.sticky {
      position: relative !important;
      top: auto !important;
      left: auto !important;
      height: auto !important;
      width: 35% !important;
      max-width: 35% !important;
      float: left !important;
      padding-right: 0 !important;
    }
    #main:has(.sidebar) .page {
      float: right !important;
      width: 62% !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }
    #main:has(.sidebar) .page__inner-wrap {
      width: 100% !important;
      float: none !important;
    }
  }
  .author__avatar,
  .author__avatar img {
    width: 100% !important;
    max-width: 100% !important;
  }
  .author__avatar img {
    height: auto !important;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    border-radius: 0 !important;
    box-shadow: none !important;
    border: none !important;
    padding: 0 !important;
  }
  /* Hide footer (Follow / Feed / copyright) */
  .page__footer { display: none !important; }
   /* Sidebar: full opacity, no GPU transform (fixes faded / soft photo) */
  .sidebar,
  .sidebar.sticky {
    opacity: 1 !important;
    transform: none !important;
    -webkit-transform: none !important;
    backface-visibility: visible !important;
  }

   /* --- Top bar: name far left, tabs far right --- */
    .masthead__inner-wrap {
    max-width: 100% !important;
    padding-left: 1.5em !important;
    padding-right: 0 !important;
  }
  .greedy-nav {
    display: flex !important;
    width: 100% !important;
  }
   .greedy-nav .visible-links {
    display: flex !important;
    flex: 0 0 calc(100% - 40px) !important;
    flex-wrap: wrap !important;
    align-items: center !important;
    width: auto !important;
  }
  .greedy-nav .visible-links li.masthead__menu-item--lg {
    margin-right: auto !important;
  }
  .greedy-nav .visible-links li.masthead__menu-item--lg a {
    white-space: nowrap !important;
  }
  .greedy-nav .visible-links li.masthead__menu-item--lg a:before {
    display: none !important;
  }
  .greedy-nav button { display: none !important; }

  /* Hide the "Follow" button that appears on small screens */
  .author__urls-wrapper button,
  .author__urls-wrapper .btn { display: none !important; }

   /* Pages without the photo sidebar: center the content */
  @media (min-width: 64em) {
    #main:not(:has(.sidebar)) .page {
      float: none !important;
      width: 100% !important;
      max-width: 860px !important;
      margin: 0 auto !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }
    #main:not(:has(.sidebar)) .page__inner-wrap {
      float: none !important;
      width: 100% !important;
    }
  }
</style>

<script data-goatcounter="https://vibhuti-mehta.goatcounter.com/count"
           async src="//gc.zgo.at/count.js"></script>
<!-- end custom head snippets -->
